<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="900" height="580" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">My Library — Architecture</text>

  <!-- ── USER ── -->
  <g>
    <rect x="370" y="60" width="160" height="56" rx="10" fill="#3b82f6" />
    <text x="450" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="white">Browser / Mobile</text>
    <text x="450" y="102" text-anchor="middle" font-size="11" fill="#bfdbfe">React · TypeScript · Tailwind</text>
  </g>

  <!-- Arrow: Browser → Nginx -->
  <line x1="450" y1="116" x2="450" y2="148" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── NGINX ── -->
  <g>
    <rect x="340" y="148" width="220" height="48" rx="10" fill="#0f172a"/>
    <text x="450" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="white">Nginx</text>
    <text x="450" y="185" text-anchor="middle" font-size="11" fill="#94a3b8">Reverse proxy · Static files</text>
  </g>

  <!-- Arrow: Nginx → FastAPI -->
  <line x1="450" y1="196" x2="450" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── FASTAPI ── -->
  <g>
    <rect x="300" y="236" width="300" height="70" rx="10" fill="#059669"/>
    <text x="450" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="white">FastAPI</text>
    <text x="450" y="278" text-anchor="middle" font-size="11" fill="#a7f3d0">Python 3.11 Alpine · Uvicorn</text>
    <text x="450" y="295" text-anchor="middle" font-size="11" fill="#a7f3d0">SQLAlchemy async · JWT Auth</text>
  </g>

  <!-- Arrow: FastAPI → PostgreSQL -->
  <line x1="340" y1="306" x2="220" y2="370" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: FastAPI → Redis -->
  <line x1="450" y1="306" x2="450" y2="370" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: FastAPI → OpenLibrary -->
  <line x1="600" y1="271" x2="720" y2="271" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- ── POSTGRESQL ── -->
  <g>
    <rect x="80" y="370" width="200" height="70" rx="10" fill="#1d4ed8"/>
    <text x="180" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="white">PostgreSQL 15</text>
    <text x="180" y="412" text-anchor="middle" font-size="11" fill="#bfdbfe">users · books · sections</text>
    <text x="180" y="428" text-anchor="middle" font-size="11" fill="#bfdbfe">processing_tasks</text>
  </g>

  <!-- ── REDIS ── -->
  <g>
    <rect x="340" y="370" width="220" height="70" rx="10" fill="#dc2626"/>
    <text x="450" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="white">Redis 7</text>
    <text x="450" y="412" text-anchor="middle" font-size="11" fill="#fecaca">Celery broker · Task results</text>
    <text x="450" y="428" text-anchor="middle" font-size="11" fill="#fecaca">Rate-limit circuit breaker</text>
  </g>

  <!-- Arrow: Redis → Worker -->
  <line x1="450" y1="440" x2="450" y2="490" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── CELERY WORKER ── -->
  <g>
    <rect x="290" y="490" width="320" height="70" rx="10" fill="#7c3aed"/>
    <text x="450" y="514" text-anchor="middle" font-size="13" font-weight="600" fill="white">Celery Worker</text>
    <text x="450" y="532" text-anchor="middle" font-size="11" fill="#ddd6fe">OCR · Book search · Auto-insert</text>
    <text x="450" y="549" text-anchor="middle" font-size="11" fill="#ddd6fe">Retry · Circuit breaker</text>
  </g>

  <!-- Arrow: Worker → Gemini -->
  <line x1="610" y1="525" x2="718" y2="430" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Arrow: Worker → OpenLibrary (diagonal) -->
  <line x1="610" y1="510" x2="748" y2="340" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- ── OPENLIB ── -->
  <g>
    <rect x="720" y="240" width="158" height="60" rx="10" fill="#f59e0b"/>
    <text x="799" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="white">OpenLibrary</text>
    <text x="799" y="281" text-anchor="middle" font-size="11" fill="#fef3c7">Free API · No key</text>
    <text x="799" y="296" text-anchor="middle" font-size="11" fill="#fef3c7">Metadata · Covers</text>
  </g>

  <!-- ── GEMINI ── -->
  <g>
    <rect x="720" y="390" width="158" height="60" rx="10" fill="#8b5cf6"/>
    <text x="799" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="white">Gemini 2.5 Flash</text>
    <text x="799" y="431" text-anchor="middle" font-size="11" fill="#ede9fe">Vision API · Free tier</text>
    <text x="799" y="447" text-anchor="middle" font-size="11" fill="#ede9fe">Cover OCR</text>
  </g>

  <!-- Legend: dashed = external HTTP -->
  <line x1="30" y1="548" x2="60" y2="548" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="68" y="552" font-size="11" fill="#64748b">Chiamata HTTP esterna</text>
  <line x1="200" y1="548" x2="230" y2="548" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="238" y="552" font-size="11" fill="#64748b">Comunicazione interna Docker</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

</svg>
